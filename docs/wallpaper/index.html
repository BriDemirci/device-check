<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>device-check · wallpaper</title>
<style>
  :root {
    --op: .88;
    --mono: "JetBrains Mono", "Cascadia Code", "SF Mono", ui-monospace, Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html { font-size: clamp(11px, .78vw, 24px); background: #000; }
  body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; color: var(--texto); background: var(--fondo); font-family: var(--sans); -webkit-font-smoothing: antialiased; user-select: none; }
  .pausado * { animation-play-state: paused !important; }

  /* ---------- Escena y fondos ---------- */
  #fondo { position: fixed; inset: 0; z-index: 0; overflow: hidden; }
  #fondo i { position: absolute; border-radius: 50%; filter: blur(9vw); opacity: .9; }
  #espectro { position: fixed; left: 0; right: 0; bottom: 0; width: 100%; height: 34vh; z-index: 1; pointer-events: none; }
  .escena {
    position: fixed; inset: 0; z-index: 2; display: grid; gap: 2.2rem;
    padding: var(--pad-arriba, 3rem) 3.5rem 5.5rem;   /* abajo: lugar para la barra de tareas real */
    grid-template-columns: minmax(0, 46rem) 1fr minmax(0, 30rem);
    grid-template-rows: auto 1fr auto;
    grid-template-areas: "reloj reloj reloj" "term . ." "term . musica";
  }
  body[data-lado="derecha"] .escena { grid-template-columns: minmax(0, 30rem) 1fr minmax(0, 46rem); grid-template-areas: "reloj reloj reloj" ". . term" "musica . term"; }
  #reloj { grid-area: reloj; }
  #terminal { grid-area: term; align-self: end; }
  #musica { grid-area: musica; align-self: end; }
  .widget { opacity: var(--op); transition: opacity .4s; }
  [hidden] { display: none !important; }

  pre { margin: 0; font: inherit; white-space: pre; }
  .t-cuerpo { display: flex; gap: 2.2rem; align-items: flex-start; }
  .logo { flex: none; line-height: 1.15; font-weight: 700; }
  .filas { min-width: 0; }
  .filas .titulo { font-weight: 700; }
  .filas div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .paleta { display: flex; margin-top: .8rem; }
  .paleta span { width: 1.6rem; height: 1rem; }
  .cursor { display: inline-block; width: .6em; height: 1.1em; vertical-align: text-bottom; background: var(--acento); animation: titila 1.1s steps(1) infinite; }
  @keyframes titila { 50% { opacity: 0; } }

  /* Música: estructura común, cada estilo la viste distinto */
  .m-cuerpo { display: flex; gap: 1.2rem; align-items: center; }
  .m-portada { flex: none; width: 5.6rem; height: 5.6rem; overflow: hidden; display: grid; place-items: center; font-size: 2.2rem; background: linear-gradient(135deg, var(--m-c1, #555), var(--m-c2, #222)); color: #fff; }
  .m-portada img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .m-info { min-width: 0; flex: 1; }
  .m-titulo, .m-artista { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .m-titulo { font-weight: 700; font-size: 1.3rem; }
  .m-artista { opacity: .7; margin-top: .15rem; }
  .m-progreso { display: flex; align-items: center; gap: .8rem; margin-top: 1.1rem; font-size: .85rem; font-variant-numeric: tabular-nums; }
  .m-barra { flex: 1; height: .35rem; border-radius: 99px; background: color-mix(in srgb, currentColor 22%, transparent); overflow: hidden; }
  .m-barra i { display: block; height: 100%; width: 0; border-radius: inherit; background: currentColor; }
  /* Estado de reproducción: solo informa, los wallpapers web no pueden controlar la música */
  .m-controles { display: flex; justify-content: center; margin-top: .9rem; }
  .m-estado { font-size: .8rem; font-weight: 600; padding: .3rem .8rem; border-radius: 99px; background: color-mix(in srgb, currentColor 14%, transparent); opacity: .85; }
  .m-ascii { display: none; }

  #demo {
    position: fixed; z-index: 5; top: 1rem; left: 50%; transform: translateX(-50%); display: flex; gap: .4rem; align-items: center;
    font: 12px/1 system-ui, sans-serif; background: rgba(0,0,0,.55); color: #fff; padding: .4rem .5rem .4rem .9rem; border-radius: 99px;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); user-select: auto;
  }
  #demo button { font: inherit; border: 0; border-radius: 99px; padding: .45rem .8rem; background: rgba(255,255,255,.12); color: inherit; cursor: pointer; }
  #demo button[aria-pressed="true"] { background: #fff; color: #000; }
  #demo a { color: #9cf; margin: 0 .4rem; }

  /* =====================================================================
     ANDROID · terminal estilo Termux
     ===================================================================== */
  body[data-estilo="android"] {
    --fondo: #050807; --texto: #c9d4ce; --acento: #3ddc84; --dim: #6b7d74;
    font-family: var(--mono);
  }
  [data-estilo="android"] #fondo { background: radial-gradient(ellipse at 20% 110%, #0d2a1b 0%, transparent 60%), repeating-linear-gradient(to bottom, rgba(255,255,255,.025) 0 1px, transparent 1px 3px), #050807; }
  [data-estilo="android"] #reloj { font-family: var(--mono); }
  [data-estilo="android"] #reloj .r-prompt { color: var(--dim); font-size: 1.1rem; }
  [data-estilo="android"] #reloj .r-hora { font-size: 7rem; font-weight: 700; line-height: 1; color: var(--acento); text-shadow: 0 0 2rem color-mix(in srgb, var(--acento) 40%, transparent); }
  [data-estilo="android"] #reloj .r-fecha { color: var(--texto); font-size: 1.3rem; margin-top: .4rem; }
  [data-estilo="android"] .widget { background: rgba(5,8,7,.82); border: 1px solid #1f2925; padding: 1.4rem 1.6rem; font-size: 1rem; line-height: 1.5; }
  [data-estilo="android"] .t-barra, [data-estilo="android"] .m-cab::before { color: var(--dim); }
  [data-estilo="android"] .logo, [data-estilo="android"] .filas .k, [data-estilo="android"] .filas .titulo { color: var(--acento); }
  [data-estilo="android"] .m-cuerpo, [data-estilo="android"] .m-progreso, [data-estilo="android"] .m-controles { display: none; }
  [data-estilo="android"] .m-ascii { display: block; }
  [data-estilo="android"] .m-cab { color: var(--dim); margin-bottom: .5rem; }

  /* =====================================================================
     iOS · pantalla bloqueada, vidrio esmerilado
     ===================================================================== */
  body[data-estilo="ios"] { --fondo: #1b1340; --texto: #fff; --acento: #fff; --dim: rgba(255,255,255,.65); --pad-arriba: 4rem; }
  [data-estilo="ios"] #fondo { background: linear-gradient(160deg, #2b1a6b, #0e1a4a 55%, #04203a); }
  [data-estilo="ios"] #fondo i:nth-child(1) { width: 55vw; height: 55vw; left: -12vw; top: -15vw; background: #ff5f9e; animation: flota 38s ease-in-out infinite alternate; }
  [data-estilo="ios"] #fondo i:nth-child(2) { width: 50vw; height: 50vw; right: -10vw; top: 10vh; background: #5b6cff; animation: flota 44s ease-in-out infinite alternate-reverse; }
  [data-estilo="ios"] #fondo i:nth-child(3) { width: 45vw; height: 45vw; left: 30vw; bottom: -25vw; background: #19c3d6; animation: flota 50s ease-in-out infinite alternate; }
  [data-estilo="ios"] #fondo i:nth-child(4) { width: 30vw; height: 30vw; left: 55vw; top: -10vw; background: #ffb347; opacity: .6; }
  @keyframes flota { to { transform: translate(6vw, 4vh) scale(1.08); } }
  [data-estilo="ios"] #reloj { text-align: center; text-shadow: 0 .2rem 1.5rem rgba(0,0,0,.25); }
  [data-estilo="ios"] #reloj .r-prompt { display: none; }
  [data-estilo="ios"] #reloj .r-fecha { order: -1; font-size: 1.7rem; font-weight: 600; opacity: .9; }
  [data-estilo="ios"] #reloj .r-hora { font-size: 10rem; font-weight: 600; line-height: 1; letter-spacing: -.02em; font-family: "SF Pro Rounded", var(--sans); }
  [data-estilo="ios"] #reloj { display: flex; flex-direction: column; align-items: center; gap: .2rem; }
  [data-estilo="ios"] .widget {
    background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.22); border-radius: 2rem; padding: 1.5rem 1.7rem;
    backdrop-filter: blur(28px) saturate(170%); -webkit-backdrop-filter: blur(28px) saturate(170%); box-shadow: 0 1rem 3rem rgba(0,0,0,.18);
  }
  [data-estilo="ios"] #terminal { font-family: var(--mono); font-size: .95rem; background: rgba(15,15,25,.42); }
  [data-estilo="ios"] .t-barra { color: var(--dim); margin-bottom: .8rem; }
  [data-estilo="ios"] .logo { font-size: .62rem; }
  [data-estilo="ios"] .filas .k, [data-estilo="ios"] .filas .titulo { color: #8fd3ff; }
  [data-estilo="ios"] .m-cab { display: none; }
  [data-estilo="ios"] .m-portada { border-radius: .9rem; }

  /* =====================================================================
     macOS · escritorio con barra de menú y ventana de Terminal
     ===================================================================== */
  body[data-estilo="macos"] { --fondo: #0d1b3a; --texto: #f2f2f7; --acento: #ff9f0a; --dim: #98989f; --pad-arriba: 4.2rem; }
  [data-estilo="macos"] #fondo {
    background:
      radial-gradient(ellipse 80% 60% at 75% 20%, #ff8a3d 0%, transparent 60%),
      radial-gradient(ellipse 70% 70% at 15% 80%, #6d3cff 0%, transparent 60%),
      radial-gradient(ellipse 90% 60% at 50% 105%, #0a84ff 0%, transparent 60%),
      linear-gradient(160deg, #241452, #0d1b3a 60%, #062a4f);
  }
  #menubar { display: none; }
  [data-estilo="macos"] #menubar {
    display: flex; position: fixed; z-index: 3; top: 0; left: 0; right: 0; height: 2.1rem; align-items: center; gap: 1.6rem; padding: 0 1.2rem;
    font-size: .95rem; color: #fff; background: rgba(30,30,40,.28); backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%);
  }
  #menubar .derecha { margin-left: auto; display: flex; gap: 1.2rem; }
  #menubar b { font-weight: 700; }
  [data-estilo="macos"] #reloj {
    justify-self: end; text-align: left; padding: 1.2rem 1.6rem; border-radius: 1.6rem; color: #fff;
    background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.18); backdrop-filter: blur(30px) saturate(170%); -webkit-backdrop-filter: blur(30px) saturate(170%);
  }
  [data-estilo="macos"] #reloj .r-prompt { font-size: .85rem; font-weight: 600; color: var(--acento); text-transform: uppercase; letter-spacing: .04em; }
  [data-estilo="macos"] #reloj .r-hora { font-size: 4.6rem; font-weight: 300; line-height: 1.05; }
  [data-estilo="macos"] #reloj .r-fecha { font-size: 1.05rem; opacity: .75; }
  [data-estilo="macos"] #terminal { padding: 0; border-radius: .9rem; overflow: hidden; background: rgba(28,28,32,.78); border: 1px solid rgba(255,255,255,.12); box-shadow: 0 2.2rem 5rem rgba(0,0,0,.45); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); font-family: var(--mono); font-size: .95rem; }
  [data-estilo="macos"] .t-barra { display: flex; align-items: center; justify-content: center; position: relative; height: 2.4rem; color: var(--dim); font-family: var(--sans); font-size: .9rem; font-weight: 600; background: rgba(255,255,255,.05); border-bottom: 1px solid rgba(255,255,255,.06); }
  [data-estilo="macos"] .t-barra::before { content: ""; position: absolute; left: 1rem; width: .8rem; height: .8rem; border-radius: 50%; background: #ff5f57; box-shadow: 1.25rem 0 #febc2e, 2.5rem 0 #28c840; }
  [data-estilo="macos"] .t-contenido { padding: 1.3rem 1.5rem 1.4rem; }
  [data-estilo="macos"] .logo { font-size: .62rem; }
  .logo .g { color: #61bb46; } .logo .y { color: #fdb827; } .logo .o { color: #f5821f; }
  .logo .r { color: #e03a3e; } .logo .v { color: #b05cc0; } .logo .b { color: #18a7e0; }
  [data-estilo="macos"] .filas .k, [data-estilo="macos"] .filas .titulo { color: #ffd60a; }
  [data-estilo="macos"] #musica { border-radius: 1.6rem; padding: 1.4rem; color: #fff; background: color-mix(in srgb, var(--m-c1, #5e5ce6) 55%, rgba(20,20,30,.6)); border: 1px solid rgba(255,255,255,.16); backdrop-filter: blur(30px) saturate(170%); -webkit-backdrop-filter: blur(30px) saturate(170%); box-shadow: 0 1.5rem 3.5rem rgba(0,0,0,.35); }
  [data-estilo="macos"] .m-cab { font-size: .8rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; opacity: .7; margin-bottom: .8rem; }
  [data-estilo="macos"] .m-portada { width: 6.4rem; height: 6.4rem; border-radius: .8rem; box-shadow: 0 .6rem 1.4rem rgba(0,0,0,.35); }
  [data-estilo="macos"] .m-controles { display: none; }

  /* =====================================================================
     Windows 11 · Fluent, bloom azul y acrílico
     ===================================================================== */
  body[data-estilo="windows"] { --fondo: #04122e; --texto: #fff; --acento: #4cc2ff; --dim: #a8b8d0; }
  [data-estilo="windows"] #fondo { background: radial-gradient(ellipse 60% 70% at 50% 60%, #1f6fff 0%, #0b3a9e 30%, #04122e 70%); }
  [data-estilo="windows"] #fondo i { filter: blur(3.5vw); border-radius: 50% 50% 50% 0; opacity: .75; left: 50%; top: 55%; width: 26vw; height: 26vw; transform-origin: 0 100%; }
  [data-estilo="windows"] #fondo i:nth-child(1) { background: linear-gradient(135deg, #7fd3ff, #1f6fff); transform: rotate(-60deg); }
  [data-estilo="windows"] #fondo i:nth-child(2) { background: linear-gradient(135deg, #a3e1ff, #2a7bff); transform: rotate(-20deg); }
  [data-estilo="windows"] #fondo i:nth-child(3) { background: linear-gradient(135deg, #5ab8ff, #0047c2); transform: rotate(20deg); }
  [data-estilo="windows"] #fondo i:nth-child(4) { background: linear-gradient(135deg, #c8efff, #3d8bff); transform: rotate(60deg) scale(.85); }
  [data-estilo="windows"] #reloj { text-align: center; color: #fff; text-shadow: 0 .2rem 1.2rem rgba(0,0,0,.3); font-family: "Segoe UI Variable Display", "Segoe UI", var(--sans); }
  [data-estilo="windows"] #reloj .r-prompt { display: none; }
  [data-estilo="windows"] #reloj .r-hora { font-size: 8.5rem; font-weight: 600; line-height: 1; }
  [data-estilo="windows"] #reloj .r-fecha { font-size: 1.6rem; font-weight: 500; margin-top: .3rem; }
  [data-estilo="windows"] .widget {
    background: rgba(32,32,40,.55); border: 1px solid rgba(255,255,255,.1); border-radius: .75rem;
    backdrop-filter: blur(40px) saturate(150%); -webkit-backdrop-filter: blur(40px) saturate(150%); box-shadow: 0 1.6rem 3.6rem rgba(0,0,0,.4);
    font-family: "Segoe UI Variable Text", "Segoe UI", var(--sans);
  }
  [data-estilo="windows"] #terminal { padding: 0; overflow: hidden; background: rgba(12,12,16,.78); font-family: "Cascadia Code", "Cascadia Mono", Consolas, var(--mono); font-size: .95rem; }
  [data-estilo="windows"] .t-barra { display: flex; align-items: end; height: 2.6rem; padding: 0 .6rem; background: rgba(255,255,255,.04); font-family: "Segoe UI", var(--sans); font-size: .85rem; }
  [data-estilo="windows"] .t-barra span { background: rgba(12,12,16,.9); padding: .45rem 1.1rem; border-radius: .5rem .5rem 0 0; color: #fff; }
  [data-estilo="windows"] .t-barra span::before { content: ">_ "; color: var(--acento); font-weight: 700; }
  [data-estilo="windows"] .t-contenido { padding: 1.3rem 1.5rem 1.4rem; }
  [data-estilo="windows"] .logo { font-size: .55rem; line-height: 1.02; }
  .logo .q1 { color: #6fd0ff; } .logo .q2 { color: #3aa8ff; } .logo .q3 { color: #1f86f0; } .logo .q4 { color: #0a63c9; }
  [data-estilo="windows"] .filas .k, [data-estilo="windows"] .filas .titulo { color: var(--acento); }
  [data-estilo="windows"] #musica { padding: 1.3rem 1.4rem; }
  [data-estilo="windows"] .m-cab { font-size: .85rem; opacity: .8; margin-bottom: .9rem; display: flex; align-items: center; gap: .5rem; }
  [data-estilo="windows"] .m-cab::before { content: ""; width: 1rem; height: 1rem; border-radius: .25rem; background: var(--acento); }
  [data-estilo="windows"] .m-portada { border-radius: .5rem; }
  [data-estilo="windows"] .m-barra i { background: var(--acento); }

  @media (max-width: 900px) {
    html { font-size: 11px; }
    .escena, body[data-lado="derecha"] .escena { grid-template-columns: 1fr; grid-template-areas: "reloj" "term" "musica"; grid-template-rows: auto auto auto; overflow-y: auto; padding: 4rem 16px 6rem; }
    .t-cuerpo { flex-direction: column; gap: 1rem; }
  }
  @media (prefers-reduced-motion: reduce) { #fondo i, .cursor { animation: none !important; } }
</style>
<script src="core.js"></script>
</head>
<body data-estilo="windows" data-lado="izquierda">
<div id="fondo" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<canvas id="espectro" aria-hidden="true"></canvas>

<div id="menubar" aria-hidden="true">
  <svg width="14" height="17" viewBox="0 0 14 17" fill="#fff"><path d="M11.6 9c0-2 1.7-3 1.8-3.1-1-1.4-2.5-1.6-3-1.6-1.3-.1-2.5.8-3.2.8-.7 0-1.7-.8-2.8-.7C3 4.4 1.7 5.2 1 6.5c-1.5 2.6-.4 6.4 1.1 8.5.7 1 1.5 2.2 2.6 2.1 1.1 0 1.4-.7 2.7-.7 1.3 0 1.6.7 2.7.7 1.1 0 1.8-1 2.5-2 .8-1.2 1.1-2.3 1.1-2.4 0 0-2.1-.8-2.1-3.2ZM9.5 3c.6-.7 1-1.7.9-2.7-.9 0-1.9.6-2.5 1.3-.5.6-1 1.6-.9 2.6 1 .1 1.9-.5 2.5-1.2Z"/></svg>
  <b>Finder</b><span>Archivo</span><span>Edición</span><span>Ver</span><span>Ir</span><span>Ventana</span>
  <div class="derecha"><span id="mb-bat"></span><span id="mb-hora"></span></div>
</div>

<main class="escena">
  <section id="reloj" class="widget-reloj">
    <div class="r-prompt"></div>
    <div class="r-hora">--:--</div>
    <div class="r-fecha"></div>
  </section>

  <section id="terminal" class="widget">
    <div class="t-barra"></div>
    <div class="t-contenido">
      <div class="t-prompt"></div>
      <div class="t-cuerpo">
        <pre class="logo"></pre>
        <div class="filas"></div>
      </div>
      <div class="t-final"></div>
    </div>
  </section>

  <section id="musica" class="widget">
    <div class="m-cab"></div>
    <div class="m-cuerpo">
      <div class="m-portada">♪</div>
      <div class="m-info"><div class="m-titulo"></div><div class="m-artista"></div></div>
    </div>
    <div class="m-progreso"><span class="m-pos">0:00</span><div class="m-barra"><i></i></div><span class="m-dur">0:00</span></div>
    <div class="m-controles"><span class="m-estado"></span></div>
    <pre class="m-ascii"></pre>
  </section>
</main>

<div id="demo" hidden>
  <span>vista previa ·</span>
  <button data-e="android">Android</button><button data-e="ios">iOS</button><button data-e="macos">macOS</button><button data-e="windows">Windows</button>
  <a href="https://github.com/BriDemirci/device-check#wallpaper" target="_blank" rel="noopener">descargar</a>
</div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => DC.esc(s);

/* ---------- Configuración (la cambian Wallpaper Engine o Lively desde sus opciones) ---------- */
const cfg = {
  estilo: "auto", lado: "izquierda", acento: null,
  terminal: true, musica: true, reloj: true, visualizador: true,
  segundos: false, h24: true, opacidad: 88, sensibilidad: 10, colorPortada: true, fps: 30,
};
const params = new URLSearchParams(location.search);
if (params.get("estilo")) cfg.estilo = params.get("estilo");

let d = null, bat = null, pausado = false, fuente = null;  // fuente: "we" | "lively" | "demo"
const pista = { titulo: "", artista: "", portada: null, c1: null, c2: null, estado: "stopped", pos: 0, dur: 0, marca: 0 };
const BANDAS = 64;
const audio = new Float32Array(BANDAS);

/* ---------- Logos ASCII ---------- */
const ROBOT = String.raw`    \           /
     \         /
    .-'-------'-.
   /   o     o   \
  |               |
  +---------------+
 ||               ||
 ||               ||
 ||               ||
  +---------------+
     |  |   |  |
     '--'   '--'`;
const MANZANA = [
  ["                    'c.", "g"], ["                 ,xNMM.", "g"], ["               .OMMMMo", "g"], ["               OMMM0,", "g"],
  ["     .;loddo:' loolloddol;.", "g"], ["   cKMMMMMMMMMMNWMMMMMMMMMM0:", "g"], [" .KMMMMMMMMMMMMMMMMMMMMMMMWd.", "y"],
  [" XMMMMMMMMMMMMMMMMMMMMMMMX.", "y"], [";MMMMMMMMMMMMMMMMMMMMMMMM:", "o"], [":MMMMMMMMMMMMMMMMMMMMMMMM:", "o"],
  [".MMMMMMMMMMMMMMMMMMMMMMMMX.", "r"], [" kMMMMMMMMMMMMMMMMMMMMMMMMWd.", "r"], [" .XMMMMMMMMMMMMMMMMMMMMMMMMMMk", "v"],
  ["  .XMMMMMMMMMMMMMMMMMMMMMMMMK.", "v"], ["    kMMMMMMMMMMMMMMMMMMMMMMd", "b"], ["     ;KMMMMMMMWXXWMMMMMMMk.", "b"], ["       .cooc,.    .,coo:.", "b"],
];
function logoWindows() {
  const fila = (a, b) => `<span class="${a}">${"█".repeat(13)}</span>  <span class="${b}">${"█".repeat(13)}</span>`;
  return [...Array(6).fill(fila("q1", "q2")), "", ...Array(6).fill(fila("q3", "q4"))].join("\n");
}

const ESTILOS = {
  android: { prompt: h => `<span style="color:var(--acento)">you@${h}</span><span style="color:var(--dim)">:~$</span> `, barra: "", logo: () => esc(ROBOT), musicaCab: "$ playerctl metadata --follow", relojPrompt: "$ date +%H:%M" },
  ios:     { prompt: h => `<span style="color:var(--dim)">you@${h} ~ %</span> `, barra: "Terminal", logo: () => MANZANA.map(([l, c]) => `<span class="${c}">${esc(l)}</span>`).join("\n"), musicaCab: "", relojPrompt: "" },
  macos:   { prompt: h => `<span style="color:#32d74b">you@${h}</span> <span style="color:var(--dim)">~ %</span> `, barra: "you — zsh — 80×24", logo: () => MANZANA.map(([l, c]) => `<span class="${c}">${esc(l)}</span>`).join("\n"), musicaCab: "Música", relojPrompt: "Reloj" },
  windows: { prompt: () => `<span style="color:var(--dim)">PS C:\\Users\\you&gt;</span> `, barra: "<span>PowerShell</span>", logo: logoWindows, musicaCab: "Reproduciendo ahora", relojPrompt: "" },
};

function estiloActual() {
  if (ESTILOS[cfg.estilo]) return cfg.estilo;
  return d && ESTILOS[d.clave] ? d.clave : "windows";
}

function host() {
  const base = d?.so === "Windows" ? "pc" : d?.so === "macOS" ? "mac" : d?.modelo || d?.tipo || "device";
  return base.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 20) || "device";
}

/* ---------- Pintado ---------- */

function aplicar() {
  const e = estiloActual(), E = ESTILOS[e];
  document.body.dataset.estilo = e;
  document.body.dataset.lado = cfg.lado;
  document.body.style.setProperty("--op", cfg.opacidad / 100);
  if (cfg.acento) document.body.style.setProperty("--acento", cfg.acento); else document.body.style.removeProperty("--acento");
  $("#reloj").hidden = !cfg.reloj;
  $("#terminal").hidden = !cfg.terminal;
  $("#musica").hidden = !cfg.musica;
  $("#espectro").hidden = !cfg.visualizador;
  ajustarLienzo();
  document.querySelectorAll("#demo button").forEach(b => b.setAttribute("aria-pressed", b.dataset.e === e));

  $(".t-barra").innerHTML = E.barra;
  $(".logo").innerHTML = E.logo();
  $(".m-cab").textContent = E.musicaCab;
  $(".r-prompt").textContent = E.relojPrompt;
  pintarTerminal();
  pintarMusica();
  reloj();
}

function pintarTerminal() {
  if (!d) return;
  const E = ESTILOS[estiloActual()], h = host();
  const quedan = ["Dispositivo", "Sistema", "Chip", "CPU", "GPU", "Memoria", "Pantalla", "Batería"];
  const filas = DC.filas(d, bat).filter(([k, v]) => quedan.includes(k) && !/^no |no disponible|enchufado/.test(v));
  if (pista.titulo) filas.push(["Sonando", `${pista.titulo}${pista.artista ? ` — ${pista.artista}` : ""}`]);
  const titulo = `you@${h}`;
  $(".t-prompt").innerHTML = E.prompt(h) + (estiloActual() === "windows" ? "fastfetch" : "neofetch");
  $(".filas").innerHTML =
    `<div class="titulo">${esc(titulo)}</div><div style="opacity:.5">${"-".repeat(titulo.length)}</div>` +
    filas.map(([k, v]) => `<div><span class="k">${esc(k)}</span>: ${esc(v)}</div>`).join("") +
    `<div class="paleta">${["#3a3a3c", "#ff6961", "#32d74b", "#ffd60a", "#0a84ff", "#bf5af2", "#64d2ff", "#e5e5ea"].map(c => `<span style="background:${c}"></span>`).join("")}</div>`;
  $(".t-final").innerHTML = `<div style="margin-top:.8rem">${E.prompt(h)}<span class="cursor"></span></div>`;
}

const mmss = s => !Number.isFinite(s) || s < 0 ? "0:00" : `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;

function posicionActual() {
  if (pista.estado !== "playing" || !pista.dur) return pista.pos;
  return Math.min(pista.dur, pista.pos + (performance.now() - pista.marca) / 1000);
}

function pintarMusica() {
  const hay = !!pista.titulo;
  $(".m-titulo").textContent = hay ? pista.titulo : "Nada sonando";
  $(".m-artista").textContent = hay ? (pista.artista || "Artista desconocido") : "Poné música y aparece acá";
  const portada = $(".m-portada");
  portada.innerHTML = pista.portada ? `<img alt="" src="${esc(pista.portada)}">` : "♪";
  const usarColor = cfg.colorPortada && pista.c1;
  document.body.style.setProperty("--m-c1", usarColor ? pista.c1 : "");
  document.body.style.setProperty("--m-c2", usarColor ? (pista.c2 || pista.c1) : "");
  if (!usarColor) { document.body.style.removeProperty("--m-c1"); document.body.style.removeProperty("--m-c2"); }
  $(".m-estado").textContent = pista.estado === "playing" ? "▶ Reproduciendo" : pista.titulo ? "❚❚ En pausa" : "■ Sin música";
  progreso();
}

function progreso() {
  const pos = posicionActual(), dur = pista.dur;
  $(".m-pos").textContent = mmss(pos);
  $(".m-dur").textContent = dur ? `-${mmss(dur - pos)}` : "0:00";
  $(".m-barra i").style.width = dur ? `${100 * pos / dur}%` : "0%";
  if (estiloActual() === "android") {
    const ancho = 24, llenos = dur ? Math.round(ancho * pos / dur) : 0;
    const icono = pista.estado === "playing" ? "▶" : pista.titulo ? "❚❚" : "■";
    $(".m-ascii").innerHTML =
      `<span style="color:var(--acento)">title</span>   ${esc(pista.titulo || "nada sonando")}\n` +
      `<span style="color:var(--acento)">artist</span>  ${esc(pista.artista || "—")}\n` +
      `<span style="color:var(--acento)">status</span>  ${icono} [<span style="color:var(--acento)">${"█".repeat(llenos)}</span><span style="color:var(--dim)">${"░".repeat(ancho - llenos)}</span>] ${mmss(pos)}/${mmss(dur)}\n` +
      `<span style="color:var(--acento)">eq</span>      <span style="color:var(--acento)">${espectroTexto(32)}</span>`;
  }
}

const BLOQUES = " ▁▂▃▄▅▆▇█";
function espectroTexto(n) {
  let s = "";
  for (let i = 0; i < n; i++) {
    const v = Math.min(1, audio[Math.floor(i * BANDAS / n)]);
    s += BLOQUES[Math.round(v * (BLOQUES.length - 1))];
  }
  return s;
}

function reloj() {
  const ahora = new Date();
  const hora = ahora.toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit", second: cfg.segundos ? "2-digit" : undefined, hourCycle: cfg.h24 ? "h23" : "h12" });
  const fecha = ahora.toLocaleDateString("es-AR", { weekday: "long", day: "numeric", month: "long" });
  $(".r-hora").textContent = hora.replace(/\s?[ap]\.\s?m\./i, "");
  $(".r-fecha").textContent = fecha.charAt(0).toUpperCase() + fecha.slice(1);
  $("#mb-hora").textContent = ahora.toLocaleString("es-AR", { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit", hourCycle: cfg.h24 ? "h23" : "h12" });
  const b = DC.infoBateria(bat);
  $("#mb-bat").textContent = b && !b.sinBateria ? `${b.porcentaje}%${b.cargando ? " ⚡" : ""}` : "";
}

/* ---------- Visualizador ---------- */

const lienzo = $("#espectro"), ctx = lienzo.getContext("2d");
function ajustarLienzo() {
  const r = Math.min(window.devicePixelRatio || 1, 2);
  lienzo.width = lienzo.clientWidth * r;
  lienzo.height = lienzo.clientHeight * r;
}
addEventListener("resize", ajustarLienzo);

function acento() { return getComputedStyle(document.body).getPropertyValue("--acento").trim() || "#4cc2ff"; }

function dibujar() {
  const W = lienzo.width, H = lienzo.height, e = estiloActual();
  ctx.clearRect(0, 0, W, H);
  if (!cfg.visualizador) return;
  const n = e === "android" ? 48 : 64;
  const ancho = W / n, color = acento();
  for (let i = 0; i < n; i++) {
    // Espejado desde el centro: graves en el medio, como la mayoría de los visualizadores
    const centro = Math.abs(i - (n - 1) / 2) / ((n - 1) / 2);
    const v = Math.min(1, audio[Math.floor(centro * (BANDAS - 1))]);
    const alto = Math.max(v * H * .92, H * .008);
    const x = i * ancho;
    if (e === "android") {
      const seg = H / 28, segs = Math.round(alto / seg);
      for (let s = 0; s < segs; s++) {
        ctx.fillStyle = s > 22 ? "#ff6b6b" : s > 16 ? "#ffb454" : color;
        ctx.globalAlpha = .55;
        ctx.fillRect(x + ancho * .15, H - (s + 1) * seg + seg * .2, ancho * .7, seg * .7);
      }
    } else if (e === "macos") {
      ctx.globalAlpha = .55;
      ctx.fillStyle = `hsl(${(i / n) * 300 + 20}, 90%, 62%)`;
      redondeado(x + ancho * .2, H - alto, ancho * .6, alto, ancho * .3);
    } else {
      const g = ctx.createLinearGradient(0, H - alto, 0, H);
      g.addColorStop(0, e === "ios" ? "rgba(255,255,255,.55)" : color);
      g.addColorStop(1, e === "ios" ? "rgba(255,255,255,.04)" : "rgba(76,194,255,.02)");
      ctx.globalAlpha = e === "ios" ? .8 : .6;
      ctx.fillStyle = g;
      redondeado(x + ancho * .18, H - alto, ancho * .64, alto, e === "ios" ? ancho * .32 : ancho * .12);
    }
  }
  ctx.globalAlpha = 1;
}
function redondeado(x, y, w, h, r) {
  ctx.beginPath();
  ctx.roundRect ? ctx.roundRect(x, y, w, h, [Math.min(r, h / 2), Math.min(r, h / 2), 0, 0]) : ctx.rect(x, y, w, h);
  ctx.fill();
}

let ultimo = 0;
function bucle(t) {
  requestAnimationFrame(bucle);
  if (pausado || t - ultimo < 1000 / cfg.fps) return;
  ultimo = t;
  if (fuente === "demo") audioDemo(t);
  else for (let i = 0; i < BANDAS; i++) audio[i] *= .9;   // cae suave si deja de llegar audio
  dibujar();
  if (estiloActual() === "android" || pista.estado === "playing") progreso();
}

/* Audio de Wallpaper Engine / Lively: 128 valores (64 canal izquierdo + 64 derecho) */
function recibirAudio(arr) {
  const k = cfg.sensibilidad / 10;
  for (let i = 0; i < BANDAS; i++) {
    const v = ((arr[i] || 0) + (arr[i + BANDAS] || 0)) / 2 * k;
    audio[i] = Math.max(v, audio[i] * .82);
  }
}

/* ---------- Integración con Wallpaper Engine ---------- */

const rgbWE = v => "#" + v.split(" ").map(x => Math.round(parseFloat(x) * 255).toString(16).padStart(2, "0")).join("");

window.wallpaperPropertyListener = {
  applyUserProperties(p) {
    fuente = fuente === "demo" ? "we" : fuente || "we";
    if (p.estilo) cfg.estilo = p.estilo.value;
    if (p.lado) cfg.lado = p.lado.value;
    if (p.usaracento) cfg.usarAcento = p.usaracento.value;
    if (p.acento) cfg.acentoWE = rgbWE(p.acento.value);
    if (p.usaracento || p.acento) cfg.acento = cfg.usarAcento ? cfg.acentoWE : null;
    for (const k of ["terminal", "musica", "reloj", "visualizador", "segundos", "h24", "colorportada"]) {
      if (p[k]) cfg[k === "colorportada" ? "colorPortada" : k] = p[k].value;
    }
    if (p.opacidad) cfg.opacidad = p.opacidad.value;
    if (p.sensibilidad) cfg.sensibilidad = p.sensibilidad.value;
    ocultarDemo();
    aplicar();
  },
  applyGeneralProperties(p) { if (p.fps) cfg.fps = p.fps; },
  setPaused(v) { pausado = v; document.body.classList.toggle("pausado", v); },
};

function registrarWE() {
  if (!window.wallpaperRegisterAudioListener) return;
  fuente = "we"; ocultarDemo();
  window.wallpaperRegisterAudioListener(recibirAudio);
  const W = window.wallpaperMediaIntegration || {};
  window.wallpaperRegisterMediaPropertiesListener?.(ev => {
    pista.titulo = ev.title || ""; pista.artista = ev.artist || ev.albumArtist || "";
    pintarMusica(); pintarTerminal();
  });
  window.wallpaperRegisterMediaThumbnailListener?.(ev => {
    pista.portada = ev.thumbnail || null; pista.c1 = ev.primaryColor || null; pista.c2 = ev.secondaryColor || null;
    pintarMusica();
  });
  window.wallpaperRegisterMediaPlaybackListener?.(ev => {
    const playing = W.PLAYBACK_PLAYING ?? 1, stopped = W.PLAYBACK_STOPPED ?? 0;
    pista.pos = posicionActual(); pista.marca = performance.now();
    pista.estado = ev.state === playing ? "playing" : ev.state === stopped ? "stopped" : "paused";
    if (pista.estado === "stopped") Object.assign(pista, { titulo: "", artista: "", portada: null, c1: null, c2: null, pos: 0, dur: 0 });
    pintarMusica(); pintarTerminal();
  });
  window.wallpaperRegisterMediaTimelineListener?.(ev => {
    pista.pos = ev.position || 0; pista.dur = ev.duration || 0; pista.marca = performance.now();
    progreso();
  });
}

/* ---------- Integración con Lively Wallpaper ---------- */

window.livelyAudioListener = arr => { if (fuente !== "lively") { fuente = "lively"; ocultarDemo(); } recibirAudio(arr); };
window.livelyPropertyListener = (nombre, valor) => {
  fuente = "lively"; ocultarDemo();
  const listas = { estilo: ["auto", "android", "ios", "macos", "windows"], lado: ["izquierda", "derecha"] };
  if (listas[nombre]) cfg[nombre] = listas[nombre][valor] ?? cfg[nombre];
  else if (nombre === "usarAcento") { cfg.usarAcento = valor; cfg.acento = valor ? cfg.acentoLively : null; }
  else if (nombre === "acento") { cfg.acentoLively = valor; if (cfg.usarAcento) cfg.acento = valor; }
  else if (nombre in cfg) cfg[nombre] = valor;
  aplicar();
};
window.livelyCurrentTrack = datos => {
  fuente = "lively"; ocultarDemo();
  const t = typeof datos === "string" ? (datos ? JSON.parse(datos) : null) : datos;
  if (!t || !t.Title) Object.assign(pista, { titulo: "", artista: "", portada: null, estado: "stopped" });
  else Object.assign(pista, {
    titulo: t.Title, artista: t.Artist || t.AlbumArtist || "", estado: "playing",
    portada: t.Thumbnail ? (t.Thumbnail.startsWith("data:") ? t.Thumbnail : `data:image/png;base64,${t.Thumbnail}`) : null,
  });
  pintarMusica(); pintarTerminal();
};

/* ---------- Vista previa en el navegador ---------- */

function iniciarDemo() {
  if (fuente) return;
  fuente = "demo";
  Object.assign(pista, { titulo: "Lo-fi para programar", artista: "device-check · vista previa", estado: "playing", pos: 47, dur: 214, marca: performance.now(), c1: "#7b5cff", c2: "#ff5f9e" });
  $("#demo").hidden = false;
  pintarMusica(); pintarTerminal();
}
function ocultarDemo() { $("#demo").hidden = true; }
function audioDemo(t) {
  const s = t / 1000, golpe = Math.max(0, Math.sin(s * Math.PI * 2 * 1.5)) ** 8;
  for (let i = 0; i < BANDAS; i++) {
    const base = (1 - i / BANDAS) ** 1.6 * .75;
    const v = base * (.55 + .45 * Math.sin(s * 2.1 + i * .37) * Math.sin(s * 1.3 + i * .11)) + golpe * (1 - i / BANDAS) * .35;
    audio[i] = Math.max(v, audio[i] * .85);
  }
  if (posicionActual() >= pista.dur) { pista.pos = 0; pista.marca = performance.now(); }
}
document.querySelectorAll("#demo button").forEach(b => b.addEventListener("click", () => { cfg.estilo = b.dataset.e; aplicar(); }));

/* ---------- Arranque ---------- */

(async () => {
  ajustarLienzo();
  aplicar();
  registrarWE();
  [d, bat] = await Promise.all([DC.detectar(), DC.bateria(() => { pintarTerminal(); reloj(); })]);
  aplicar();
  setInterval(reloj, 1000);
  setTimeout(iniciarDemo, 1500);   // si en 1,5 s no habló Wallpaper Engine ni Lively, mostramos la vista previa
  requestAnimationFrame(bucle);
})();
</script>
</body>
</html>
