<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0d0c">
<title>Panel Termux</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0d0c; --bg-2: #111614; --line: #1f2925;
    --text: #c9d4ce; --dim: #6b7d74; --green: #3ddc84; --cyan: #5ccfe6;
    --amber: #ffb454; --red: #ff6b6b; --magenta: #d291ff; --blue: #73b8ff;
    --mono: "JetBrains Mono", ui-monospace, "Droid Sans Mono", "Roboto Mono", monospace;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font: 14px/1.55 var(--mono); -webkit-font-smoothing: antialiased;
    padding-bottom: calc(64px + env(safe-area-inset-bottom));
  }
  /* Líneas de escaneo muy sutiles, como un monitor viejo */
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 5;
    background: repeating-linear-gradient(to bottom, rgba(255,255,255,.018) 0 1px, transparent 1px 3px);
  }
  main { max-width: 960px; margin: 0 auto; padding: 18px 16px 24px; }
  ::selection { background: var(--green); color: var(--bg); }

  .barra-estado {
    display: flex; justify-content: space-between; gap: 12px; color: var(--dim);
    font-size: 12px; border-bottom: 1px dashed var(--line); padding-bottom: 8px; margin-bottom: 14px;
  }
  .prompt { white-space: pre-wrap; word-break: break-word; margin: 18px 0 6px; }
  .u { color: var(--green); font-weight: 700; }
  .h { color: var(--cyan); font-weight: 700; }
  .p { color: var(--blue); font-weight: 700; }
  .cmd { color: var(--text); }
  .cursor { display: inline-block; width: .6em; height: 1.1em; background: var(--green); vertical-align: text-bottom; animation: titila 1.1s steps(1) infinite; }
  @keyframes titila { 50% { opacity: 0; } }

  .salida { white-space: pre; overflow-x: auto; margin: 0; }
  .dim { color: var(--dim); } .ok { color: var(--green); } .warn { color: var(--amber); } .bad { color: var(--red); }
  .cy { color: var(--cyan); } .mg { color: var(--magenta); } .bl { color: var(--blue); }

  /* neofetch */
  .neofetch { display: flex; gap: 28px; align-items: flex-start; }
  .robot { color: var(--green); margin: 0; line-height: 1.2; flex: none; text-shadow: 0 0 12px rgba(61,220,132,.35); }
  .info { margin: 0; min-width: 0; white-space: pre-wrap; word-break: break-word; }
  .info .k { color: var(--green); font-weight: 700; }
  .paleta { display: flex; gap: 0; margin-top: 10px; }
  .paleta span { width: 22px; height: 14px; }
  @media (max-width: 640px) {
    body { font-size: 12.5px; }
    .neofetch { flex-direction: column; gap: 10px; }
    .robot { font-size: 11px; }
  }

  .medidor { display: grid; grid-template-columns: 7ch 1fr; column-gap: 1ch; }
  .medidor .nom { color: var(--cyan); font-weight: 700; }
  .medidor .val { white-space: pre; overflow: hidden; }

  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th { color: var(--bg); background: var(--green); font-weight: 700; text-align: left; padding: 0 1ch; }
  td { padding: 2px 1ch; white-space: nowrap; }
  td.nom { white-space: normal; word-break: break-all; }
  th.n, td.n { text-align: right; }
  tr:hover td { background: var(--bg-2); }
  .kill {
    font: inherit; color: var(--red); background: none; border: 0; padding: 6px 4px; cursor: pointer;
  }
  .kill:hover, .kill:focus-visible { background: var(--red); color: var(--bg); outline: none; }

  .error-bloque { border-left: 2px solid var(--amber); padding: 4px 0 4px 12px; white-space: pre-wrap; }

  /* Teclas extra al estilo Termux */
  .teclas {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: #000;
    border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(5, 1fr);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .teclas button {
    font: 700 12px var(--mono); letter-spacing: .04em; color: var(--text); background: none;
    border: 0; border-right: 1px solid var(--line); min-height: 52px; cursor: pointer;
  }
  .teclas button:last-child { border-right: 0; }
  .teclas button:active, .teclas button.on { color: var(--bg); background: var(--green); }
  .teclas button:focus-visible { outline: 2px solid var(--cyan); outline-offset: -2px; }

  #toast {
    position: fixed; left: 16px; right: 16px; bottom: calc(64px + env(safe-area-inset-bottom)); z-index: 11;
    max-width: 560px; margin: 0 auto; background: var(--bg-2); border: 1px solid var(--green); color: var(--green);
    padding: 10px 14px; opacity: 0; transform: translateY(8px); transition: .25s; pointer-events: none;
  }
  #toast.visible { opacity: 1; transform: none; }

  @media (prefers-reduced-motion: reduce) {
    .cursor { animation: none; } #toast { transition: none; }
  }
</style>
</head>
<body>
<main>
  <div class="barra-estado">
    <span id="reloj">--:--</span>
    <span id="conexion">conectando…</span>
  </div>

  <div class="prompt" id="p-neofetch"></div>
  <section class="neofetch">
<pre class="robot" aria-hidden="true">
    \           /
     \         /
    .-'-------'-.
   /   o     o   \
  |               |
  +---------------+
 ||               ||
 ||               ||
 ||               ||
  +---------------+
     |  |   |  |
     '--'   '--'</pre>
    <div>
      <pre class="info" id="info">cargando…</pre>
      <div class="paleta" aria-hidden="true">
        <span style="background:#1f2925"></span><span style="background:var(--red)"></span><span style="background:var(--green)"></span><span style="background:var(--amber)"></span><span style="background:var(--blue)"></span><span style="background:var(--magenta)"></span><span style="background:var(--cyan)"></span><span style="background:var(--text)"></span>
      </div>
    </div>
  </section>

  <div class="prompt" id="p-free"></div>
  <div id="medidores"></div>

  <div class="prompt" id="p-bat"></div>
  <div id="bateria"><span class="dim">leyendo batería…</span></div>

  <div class="prompt" id="p-top"></div>
  <table>
    <thead><tr><th class="n">PID</th><th>PROCESO</th><th class="n">RES</th><th class="n">CPU%</th><th></th></tr></thead>
    <tbody id="procesos"></tbody>
  </table>

  <div class="prompt" id="p-final"></div>
</main>

<nav class="teclas" aria-label="Acciones">
  <button id="k-wake" title="Mantener la CPU despierta">WAKE</button>
  <button id="k-refresh" title="Actualizar ahora">↻ REF</button>
  <button id="k-pause" title="Pausar la actualización automática">PAUSE</button>
  <button id="k-top" title="Ir arriba">↑ TOP</button>
  <button id="k-procs" title="Ir a procesos">PS</button>
</nav>
<div id="toast" role="status"></div>

<script>
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  let disp = null, wakelock = null, pausado = false, hz = null;

  const tam = b => {
    const u = ["B", "K", "M", "G", "T"]; let i = 0;
    while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; }
    return (i >= 3 ? b.toFixed(1) : Math.round(b)) + u[i];
  };
  const clase = pct => pct >= 90 ? "bad" : pct >= 75 ? "warn" : "ok";
  const anchoBarra = () => matchMedia("(max-width: 640px)").matches ? 16 : 32;
  function barra(pct, ancho = anchoBarra()) {
    const llenos = Math.round(Math.min(pct, 100) / 100 * ancho);
    return `<span class="dim">[</span><span class="${clase(pct)}">${"█".repeat(llenos)}</span><span class="dim">${"░".repeat(ancho - llenos)}]</span>`;
  }

  function prompt(id, comando) {
    const host = disp ? disp.codigo || "android" : "android";
    const user = disp ? disp.usuario : "u0";
    $(id).innerHTML = `<span class="u">${esc(user)}@${esc(host)}</span><span class="dim">:</span><span class="p">~</span><span class="dim">$</span> <span class="cmd">${esc(comando)}</span>`;
  }

  function resolucion() {
    const dpr = window.devicePixelRatio || 1;
    const w = Math.round(screen.width * dpr), h = Math.round(screen.height * dpr);
    return `${Math.max(w, h)}x${Math.min(w, h)}`;
  }

  // Frecuencia de la pantalla: contamos cuadros durante un segundo
  function medirHz() {
    let cuadros = 0; const inicio = performance.now();
    const paso = t => {
      cuadros++;
      if (t - inicio < 1000) requestAnimationFrame(paso);
      else { const f = cuadros * 1000 / (t - inicio); hz = [30, 60, 90, 120, 144].reduce((a, b) => Math.abs(b - f) < Math.abs(a - f) ? b : a); pintarInfo(); }
    };
    requestAnimationFrame(paso);
  }

  let ultimoEstado = null;
  function pintarInfo() {
    if (!disp) return;
    const d = disp, e = ultimoEstado;
    const titulo = `${d.usuario}@${d.codigo || "android"}`;
    const cpu = d.frecuencias.length
      ? d.frecuencias.map(f => `${f.nucleos}×${f.ghz.toFixed(2)}GHz`).join(" + ")
      : `${d.nucleos} núcleos`;
    const filas = [
      ["Dispositivo", `${d.fabricante} ${d.modelo}${d.codigo ? ` (${d.codigo})` : ""}`],
      ["Android", `${d.android} · API ${d.sdk}`],
      ["Parche seg.", d.parche || "?"],
      ["Chip", d.chip || "?"],
      ["CPU", `${cpu} · ${d.abi}`],
      ["Pantalla", `${resolucion()}${hz ? ` @ ${hz}Hz` : ""}${d.densidad ? ` · ${d.densidad}dpi` : ""}`],
      ["Memoria", e ? `${tam(e.ram.usado)} / ${tam(e.ram.total)}` : "…"],
      ["Almacen.", e ? `${tam(e.disco.usado)} / ${tam(e.disco.total)}` : "…"],
      ["Batería", e && e.bateria ? `${e.bateria.porcentaje}% · salud ${e.bateria.salud.toLowerCase()}` : "sin datos"],
      ["Entorno", d.entorno],
    ];
    $("info").innerHTML =
      `<span class="u">${esc(titulo)}</span>\n<span class="dim">${"-".repeat(titulo.length)}</span>\n` +
      filas.map(([k, v]) => `<span class="k">${k}</span><span class="dim">:</span> ${esc(v)}`).join("\n");
  }

  function pintarMedidores(e) {
    const filas = [
      ["RAM", 100 * e.ram.usado / e.ram.total, `${tam(e.ram.usado)}/${tam(e.ram.total)}`],
      ["DISCO", 100 * e.disco.usado / e.disco.total, `${tam(e.disco.libre)} libres`],
      ["CPU", e.cpu.uso, `${e.cpu.nucleos} núcleos`],
    ];
    if (e.bateria) filas.push(["BAT", e.bateria.porcentaje, e.bateria.estado.toLowerCase()]);
    $("medidores").innerHTML = filas.map(([n, pct, extra]) =>
      `<div class="medidor"><span class="nom">${n}</span><span class="val">${barra(pct)} <span class="${clase(n === "BAT" ? 100 - pct : pct)}">${String(Math.round(pct)).padStart(3)}%</span> <span class="dim">${esc(extra)}</span></span></div>`
    ).join("");
  }

  function pintarBateria(e) {
    const b = e.bateria;
    if (!b) {
      const sinApp = e.bateria_error === "falta-app";
      $("bateria").innerHTML = e.bateria_error ? `<div class="error-bloque"><span class="warn">${sinApp
        ? "error: no responde la app Termux:API"
        : "error: falta el paquete termux-api"}</span>
<span class="dim">Para ver la batería:</span>
${sinApp ? "" : '  <span class="cy">pkg install termux-api</span>   <span class="dim"># en Termux</span>\n'}  instalá la app <span class="cy">Termux:API</span> desde la misma fuente que Termux
  <span class="dim">(F-Droid o GitHub; la de Play Store no es compatible)</span></div>` : `<span class="dim">leyendo batería…</span>`;
      return;
    }
    const temp = b.temperatura;
    const tClase = temp >= 45 ? "bad" : temp >= 38 ? "warn" : "ok";
    const celdas = 10, llenas = Math.round(b.porcentaje / 10);
    const icono = `<span class="dim">╭${"─".repeat(celdas)}╮</span>\n<span class="dim">│</span><span class="${clase(100 - b.porcentaje)}">${"▮".repeat(llenas)}</span><span class="dim">${"▯".repeat(celdas - llenas)}│▌</span>\n<span class="dim">╰${"─".repeat(celdas)}╯</span>`;
    const lineas = [
      ["carga", `<span class="${clase(100 - b.porcentaje)}">${b.porcentaje}%</span> · ${esc(b.estado.toLowerCase())}`],
      ["salud", `<span class="${b.salud_ok ? "ok" : "bad"}">${esc(b.salud)}</span>`],
      ["ciclos", b.ciclos != null ? b.ciclos : '<span class="dim">n/d (Android 14+)</span>'],
      ["temp", temp != null ? `<span class="${tClase}">${temp.toFixed(1)}°C</span>` : "?"],
      ["corriente", b.corriente_ma != null ? `${b.corriente_ma} mA` : "?"],
      ["conexión", esc(b.conexion)],
    ];
    $("bateria").innerHTML = `<pre class="salida">${icono}</pre><pre class="salida">${lineas.map(([k, v]) => `<span class="cy">${k.padEnd(10)}</span>${v}`).join("\n")}</pre>`;
  }

  function pintarProcesos(e) {
    $("procesos").innerHTML = e.procesos.map(p => `<tr>
      <td class="n dim">${p.pid}</td>
      <td class="nom">${esc(p.nombre)}</td>
      <td class="n">${tam(p.rss)}</td>
      <td class="n ${p.cpu >= 50 ? "bad" : p.cpu >= 15 ? "warn" : ""}">${p.cpu.toFixed(1)}</td>
      <td class="n">${p.cerrable ? `<button class="kill" data-pid="${p.pid}" data-nombre="${esc(p.nombre)}">kill</button>` : ""}</td>
    </tr>`).join("");
  }

  function toast(msg, error = false) {
    const t = $("toast");
    t.textContent = (error ? "✗ " : "✓ ") + msg;
    t.style.borderColor = t.style.color = error ? "var(--red)" : "var(--green)";
    t.classList.add("visible");
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => t.classList.remove("visible"), 2600);
  }

  async function post(url, cuerpo) {
    const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json", "X-Panel": "1" }, body: JSON.stringify(cuerpo) });
    return { ok: r.ok, datos: await r.json() };
  }

  function pintarWake() {
    $("k-wake").classList.toggle("on", wakelock === true);
    $("k-wake").setAttribute("aria-pressed", wakelock === true);
  }

  async function actualizar() {
    try {
      const e = await (await fetch("/api/estado")).json();
      ultimoEstado = e;
      pintarInfo(); pintarMedidores(e); pintarBateria(e); pintarProcesos(e);
      if (e.wakelock !== null) { wakelock = e.wakelock; pintarWake(); }
      $("conexion").innerHTML = `<span class="ok">●</span> en vivo`;
    } catch {
      $("conexion").innerHTML = `<span class="bad">●</span> sin conexión`;
    }
  }

  function pintarPrompts() {
    prompt("p-neofetch", "neofetch");
    prompt("p-free", "free -h && df -h ~");
    prompt("p-bat", "termux-battery-status");
    prompt("p-top", "top -o RES");
    prompt("p-final", "");
    $("p-final").insertAdjacentHTML("beforeend", '<span class="cursor"></span>');
  }

  $("procesos").addEventListener("click", async ev => {
    const b = ev.target.closest(".kill");
    if (!b) return;
    if (!confirm(`kill ${b.dataset.pid} (${b.dataset.nombre})?`)) return;
    b.disabled = true;
    const { ok, datos } = await post("/api/cerrar", { pid: Number(b.dataset.pid) });
    ok ? toast(`${b.dataset.nombre} cerrado`) : toast(datos.error, true);
    setTimeout(actualizar, 500);
  });

  $("k-wake").addEventListener("click", async () => {
    const { ok, datos } = await post("/api/wakelock", { activar: wakelock !== true });
    if (ok) { wakelock = datos.wakelock; pintarWake(); toast(wakelock ? "wake lock activado" : "wake lock liberado"); }
    else toast("no se pudo cambiar el wake lock", true);
  });
  $("k-refresh").addEventListener("click", () => { actualizar(); toast("actualizado"); });
  $("k-pause").addEventListener("click", () => {
    pausado = !pausado;
    $("k-pause").classList.toggle("on", pausado);
    $("k-pause").textContent = pausado ? "PLAY" : "PAUSE";
  });
  $("k-top").addEventListener("click", () => scrollTo({ top: 0, behavior: "smooth" }));
  $("k-procs").addEventListener("click", () => $("p-top").scrollIntoView({ behavior: "smooth" }));

  setInterval(() => {
    $("reloj").textContent = new Date().toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit" });
  }, 1000);

  (async () => {
    pintarPrompts();
    try { disp = await (await fetch("/api/dispositivo")).json(); } catch {}
    pintarPrompts(); pintarInfo(); medirHz();
    actualizar();
    setInterval(() => { if (!pausado && !document.hidden) actualizar(); }, 3000);
  })();
  addEventListener("resize", () => ultimoEstado && pintarMedidores(ultimoEstado));
</script>
</body>
</html>
